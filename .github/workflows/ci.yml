name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The build is part of CI because two of this site's promises are only
      # checkable in the output: every page has a Markdown twin listed in
      # /llms.txt, and no page loads a third-party resource.
      - run: npm run build
      - run: node scripts/check-build.mjs
