name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Node comes from mise.toml — do not restate the version here.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      # setup-node's `cache: npm` went away with it; this replaces that, and
      # only that. It caches downloaded packages, not the toolchain.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The build is part of CI because two of this site's promises are only
      # checkable in the output: every page has a Markdown twin listed in
      # /llms.txt, and no page loads a third-party resource.
      - run: npm run build
      - run: node scripts/check-build.mjs
